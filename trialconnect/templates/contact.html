{% extends "layout.html" %}

{% block title %}
    Contact Us - trialconnect
{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container px-4 px-lg-5">
        <div class="row justify-content-center">
            <!-- MODIFICATION: Columns now match the narrower style of other forms -->
            <div class="col-md-10 col-lg-8 col-xl-7">
                <!-- MODIFICATION: Form is now wrapped in a card with shadow -->
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header text-center">
                        <div class="feature bg-primary bg-gradient text-white rounded-3 my-4 mx-auto"><i class="bi bi-envelope"></i></div>
                        <h1 class="fw-bolder">Get in touch</h1>
                        <p class="lead fw-normal text-muted mb-0">We'd love to hear from you</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        {% if error %}
                            <div class="alert alert-danger" role="alert">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form id="contactForm" method="POST" action="{{ url_for('routes.contact') }}">
                            <!-- Name inputs -->
                            <div class="row gx-3 mb-3">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <div class="form-floating">
                                        <input class="form-control" id="firstName" name="firstName" type="text" placeholder="Enter your first name..." autocomplete="off"
                                               value="{{ session.user.firstName if session.user and session.user.firstName else '' }}" 
                                               {{ 'readonly' if session.user and session.user.firstName }} 
                                               required />
                                        <label for="firstName">First name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input class="form-control" id="lastName" name="lastName" type="text" placeholder="Enter your last name..." autocomplete="off"
                                               value="{{ session.user.lastName if session.user and session.user.lastName else '' }}" 
                                               {{ 'readonly' if session.user and session.user.lastName }} 
                                               required />
                                        <label for="lastName">Last name</label>
                                    </div>
                                </div>
                            </div>
                            <!-- Email address input-->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" autocomplete="off"
                                       value="{{ session.user.email if session.user and session.user.email else '' }}" 
                                       {{ 'readonly' if session.user and session.user.email }} 
                                       required />
                                <label for="email">Email address</label>
                            </div>
                            <!-- Message input-->
                            <div class="form-floating mb-3">
                                <textarea class="form-control" id="message" name="message" type="text" placeholder="Enter your message here..." style="height: 10rem" required></textarea>
                                <label for="message">Message</label>
                            </div>
                            <!-- Submit Button-->
                            <div class="d-grid"><button class="btn btn-primary btn-lg" id="submitButton" type="submit">Submit</button></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
