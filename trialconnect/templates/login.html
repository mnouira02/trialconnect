{% extends "layout.html" %}

{% block title %}
    Login - trialconnect
{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container px-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center fw-bolder my-4">Login</h3>
                    </div>
                    <div class="card-body p-5">
                        <form method="POST" action="{{ url_for('login') }}">
                            <!-- Email Input -->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" required />
                                <label for="email">Email address</label>
                            </div>
                            
                            <!-- Password Input with Visibility Toggle -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <input class="form-control" id="password" name="password" type="password" placeholder="Password" required />
                                    <button class="btn btn-outline-secondary" type="button" id="toggle-password">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Remember Me and Forgot Password on the same line -->
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" id="inputRememberPassword" name="rememberMe" type="checkbox" value="on" />
                                    <label class="form-check-label" for="inputRememberPassword">Remember Me</label>
                                </div>
                                <!-- MODIFIED: Link now points to the forgot_password route -->
                                <a class="small" href="{{ url_for('forgot_password') }}">Forgot Password?</a>
                            </div>

                            <!-- Full-width Login button -->
                            <div class="d-grid">
                                <button class="btn btn-primary btn-lg" type="submit">Login</button>
                            </div>
                        </form>

                        <!-- Divider -->
                        <div class="my-4 d-flex align-items-center">
                            <hr class="flex-grow-1">
                            <span class="px-3 text-muted">OR</span>
                            <hr class="flex-grow-1">
                        </div>

                        <!-- Social Auth Buttons -->
                        <div class="d-grid">
                            <a class="btn btn-danger btn-lg" href="{{ url_for('login_google') }}">
                                <i class="bi bi-google me-2"></i> Continue with Google
                            </a>
                        </div>
                    </div>
                    <div class="card-footer text-center py-3">
                        <div class="small"><a href="{{ url_for('register') }}">Need an account? Sign up!</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        function setupPasswordToggle(inputId, buttonId) {
            const inputField = document.getElementById(inputId);
            const toggleButton = document.getElementById(buttonId);
            
            toggleButton.setAttribute('tabindex', '-1');

            toggleButton.addEventListener('mousedown', () => {
                inputField.type = 'text';
            });
            toggleButton.addEventListener('mouseup', () => {
                inputField.type = 'password';
            });
            toggleButton.addEventListener('mouseleave', () => {
                inputField.type = 'password';
            });
        }

        setupPasswordToggle('password', 'toggle-password');
    });
</script>
{% endblock %}
