{% extends "layout.html" %}

{% block title %}
    Forgot Password - trialconnect
{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container px-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center fw-bolder my-4">Reset Password</h3>
                    </div>
                    <div class="card-body p-5">
                        <div class="text-muted text-center mb-4">
                            Enter your email address and we will send you a code to reset your password.
                        </div>
                        <form method="POST" action="{{ url_for('forgot_password') }}">
                            <!-- Email Input -->
                            <div class="form-floating mb-3">
                                <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" required />
                                <label for="email">Email address</label>
                            </div>
                            
                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button class="btn btn-primary btn-lg" type="submit">Send Reset Code</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3">
                        <div class="small"><a href="{{ url_for('login') }}">Remember your password? Go to login</a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
